- id: TEST-038
  name: Sensitive exports
  given: Advisor has an advisee relationship but no export grant
  when: Request a downloadable cohort report
  then: Deny the file and audit the attempt
  execution: planned
- id: TEST-039
  name: First draft and finalization
  given: The approved floor exceeds the credits of a valid first bundle
  when: Commit the first bundle in a draft and then finalize
  then: Addition succeeds. Finalization refuses the shortfall without a grant and preserves draft status
