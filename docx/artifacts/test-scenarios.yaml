  when: Expand week dates and insert a makeup meeting
  then: Only approved local occurrences exist with explicit offsets
  execution: planned
- id: TEST-034
  name: Solver lifecycle
  given: Two workers see the same persisted job
  when: Lease, retry and submit output
  then: Only current lease generation can complete the run
  execution: planned
- id: TEST-035
  name: Outbox duplicates
