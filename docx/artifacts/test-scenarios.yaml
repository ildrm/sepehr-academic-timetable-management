  execution: planned
- id: TEST-029
  name: Backlog gate
  given: A release includes a changed rule and contracts
  when: Review its evidence links
  then: No authorization to release until affected acceptance cases have passed
  execution: planned
- id: TEST-030
  name: Offering identity
  given: Two cross-listed sections use one physical pool
  when: Plan enrollment through either listing
  then: Both consume the same physical budget
  execution: planned
- id: TEST-031
  name: Policy exception
  given: Two assignments belong to the same person
  when: Attempt approval of own request using second role
  then: Reject self-approval by actor identity
  execution: planned
- id: TEST-032
  name: Institution hierarchy
  given: Faculty and department share a program code mapping
  when: Resolve a new specialization with effective dates
  then: Program, unit and pinned curriculum resolve unambiguously
  execution: planned
- id: TEST-033
  name: Calendar recurrence
