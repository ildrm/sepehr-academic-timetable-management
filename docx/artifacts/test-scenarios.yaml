- id: TEST-001
  name: Last shared seat
  given: One pool has one free claim and two eligible students
  when: Release two authenticated commits together
  then: One active enrollment and one capacity conflict
  execution: planned
- id: TEST-002
  name: One student, two writes
  given: Either course alone fits the remaining credit ceiling
  when: Race both valid requests for one student-term
  then: At most one commits and the other sees the new total
  execution: planned
- id: TEST-003
  name: Lecture and laboratory
  given: Lecture has one seat and required lab has none
  when: Commit a linked bundle
  then: No enrollment or seat claim survives
  execution: planned
- id: TEST-004
  name: Same key
  given: Two equivalent payloads carry the same actor, operation and key
  when: Send both before either response arrives
  then: Both resolve to one stored outcome and one mutation
  execution: planned
- id: TEST-005
  name: Lost response
  given: Database commits before the connection drops
  when: Retrieve status with the original operation and key
  then: Return the stored outcome with no second write
  execution: planned
- id: TEST-006
  name: Failed swap
  given: Old section is active and replacement is full
  when: Submit an atomic swap
  then: Old enrollment and claims remain active
  execution: planned
- id: TEST-007
  name: Remove corequisite
  given: The surviving course requires concurrent lab credit
  when: Drop only its partner
  then: Reject final set and preserve both
  execution: planned
- id: TEST-008
  name: Changed grade
  given: A previous provisional outcome becomes failed
  when: Append a corrected attempt and deliver event twice
  then: One review case; student stays enrolled pending decision
  execution: planned
- id: TEST-009
  name: Quota release
  given: A pool is full for general applicants only because of a reserve
  when: Evaluate immediately before and at release
  then: General access begins at release and total never increases
  execution: planned
- id: TEST-010
  name: Queue versus direct
  given: A qualified head entry exists for the shared pool
  when: Race direct commit and promotion
  then: Eligible head has first opportunity and no duplicate hold
  execution: planned
- id: TEST-011
  name: Closing instant
  given: Open interval ends at T
  when: Evaluate after locks at T minus one tick, at T and after T
  then: Only the first decision may commit
  execution: planned
- id: TEST-012
  name: Stale proposal
  given: A validated candidate names an earlier term epoch
  when: Attempt authorized publication
  then: Current version stays published and stale error returned
  execution: planned
- id: TEST-013
  name: Insufficient rooms
  given: Two pinned classes require one room at the same time
  when: Solve and independently check constraint set
  then: No publishable placement; a time limit alone yields no proof
  execution: planned
- id: TEST-014
  name: Worker termination
  given: A provider delivery may succeed before local acknowledgement
  when: Restart a worker after that boundary
  then: Consumer deduplicates; ambiguous delivery enters reconciliation
  execution: planned
- id: TEST-015
  name: Redis outage
  given: Queue storage is unreachable
  when: Commit an eligible change and later resume the relay
  then: Database fact and outbox survive; catch-up preserves per-key order
  execution: planned
- id: TEST-016
  name: Delayed financial response
  given: Optional finance adapter has stale hold information
  when: Apply the approved stale-data policy
  then: Show pending verification when policy requires a fresh hold; no implicit adverse decision
  execution: planned
- id: TEST-017
  name: Cross-scope access
  given: An academic-office assignment ends at the faculty boundary
  when: Request another faculty’s student or a different term
  then: No record data returned and access denial recorded
  execution: planned
- id: TEST-018
  name: Curriculum pin
  given: An admitted student is bound to edition A
  when: Approve B and re-run audit
  then: A remains selected unless an authorized migration occurs
  execution: planned
- id: TEST-019
  name: Rule semantics
  given: A policy allows passed A or B with minimum grade
  when: Supply only in-progress A and no B
  then: Return unmet or review according to explicit provisional rule
  execution: planned
- id: TEST-020
  name: Accessible schedule
