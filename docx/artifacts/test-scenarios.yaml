  execution: planned
- id: TEST-021
  name: Resource eligibility
  given: A pinned room lacks mandatory equipment
  when: Validate a manual change
  then: Reject candidate with component, constraint and conflict evidence
  execution: planned
- id: TEST-022
  name: Audit allocation
  given: One completion meets two exclusive groups
  when: Recompute degree audit twice
  then: Consume the completion once and explain outstanding group
  execution: planned
- id: TEST-023
  name: Recovery
