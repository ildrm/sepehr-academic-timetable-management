  when: Replay with provider reconciliation
  then: Rebuild projections and quarantine ambiguous sends
  execution: planned
- id: TEST-024
  name: Report boundary
  given: A scoped export reads a reporting watermark
  when: Change an enrollment during export
  then: Totals and details share one watermark and permitted scope
  execution: planned
- id: TEST-025
  name: Migration
  given: Two legacy attempts map to one key with different grades
  when: Dry-run import
  then: Quarantine collision and withhold cutover
  execution: planned
- id: TEST-026
  name: Fairness
  given: Two equally ranked requests compete for a single bundle
  when: Repeat allocation with fixed approved seed and input
