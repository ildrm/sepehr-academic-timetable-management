openapi: 3.1.1
info:
  title: Academic operations
  version: 0.1.0
  description: Proposed same-origin BFF contract. Mutating cookie paths require session-bound CSRF proof and Origin
    validation. Identifiers are opaque strings.
paths:
  /me/enrollment-previews:
    post:
      operationId: previewEnrollment
      summary: Evaluate the proposed final enrollment set
      description: PERM-022; enforce current assignment, relationship, time and resource scope in Nest.js.
      security:
      - session: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: &id001
          type: string
          minLength: 1
      responses:
        '200':
          description: Advisory result; no claim is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
              example:
                decision: accepted
                policyVersion: POL-A
                evaluatedRules:
                - BR-001
                reasons: []
                explanationKey: preview.eligible
        '400':
          description: Correct invalid fields and submit a fresh request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-001
                messageKey: invalid_input
                requestId: SYN-REQ
                details: []
        '401':
          description: Sign in again before checking the original request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-002
                messageKey: session_expired
                requestId: SYN-REQ
                details: []
        '403':
          description: Request access from the responsible office.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-003
                messageKey: scope_denied
                requestId: SYN-REQ
                details: []
        '404':
          description: Verify the resource reference in your authorized scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-011
                messageKey: not_found
                requestId: SYN-REQ
                details: []
        '409':
          description: Refresh available bundles or join the waitlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-005
                messageKey: capacity_conflict
                requestId: SYN-REQ
                details: []
        '422':
          description: Review rule explanations or request an allowed exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-004
                messageKey: rule_rejected
                requestId: SYN-REQ
                details: []
        '429':
          description: Retry after the indicated delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-012
                messageKey: rate_limited
                requestId: SYN-REQ
                details: []
        '503':
          description: Check request status before retrying the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ERR-010
                messageKey: retry_exhausted
                requestId: SYN-REQ
                details: []
      x-id: API-001
      x-permission: PERM-022
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/previewEnrollmentInput'
            example:
              termId: T
              add: &id004
              - &id002
                sectionId: SEC-A
                componentIds:
                - LEC-A
                - LAB-A
              dropEnrollmentIds: &id005 []
