components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: academic_session
  schemas:
    Bundle: &id008
      type: object
      additionalProperties: false
      properties:
        sectionId: *id001
        componentIds:
          type: array
          items: *id001
          uniqueItems: true
          minItems: 1
      required:
      - sectionId
      - componentIds
    Decision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - accepted
          - rejected
          - exception
          - review
        policyVersion: *id001
        evaluatedRules:
          type: array
          items: *id001
        reasons:
          type: array
          items: &id007
            type: object
            additionalProperties: false
            properties:
              ruleId: *id001
              reasonCode: *id001
              messageKey: *id001
            required:
            - ruleId
            - reasonCode
            - messageKey
        explanationKey: *id001
      required:
      - decision
      - policyVersion
      - evaluatedRules
      - reasons
      - explanationKey
    Receipt:
      type: object
      additionalProperties: false
      properties:
        requestId: *id001
        outcome:
          type: string
          enum:
          - committed
        resourceId: *id001
        revision:
          type: integer
          minimum: 1
      required:
      - requestId
      - outcome
      - resourceId
      - revision
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - ERR-001
          - ERR-002
          - ERR-003
          - ERR-004
          - ERR-005
          - ERR-006
          - ERR-007
          - ERR-008
          - ERR-009
          - ERR-010
          - ERR-011
          - ERR-012
          - ERR-013
        messageKey: *id001
        requestId: *id001
        details:
          type: array
          items: *id007
      required:
      - code
      - messageKey
      - requestId
      - details
    Run:
      type: object
      additionalProperties: false
      properties:
        runId: *id001
        state:
          type: string
          enum:
          - queued
          - running
          - finished
          - failed
        snapshotId: *id001
        resultRef:
          type:
          - string
          - 'null'
        solverStatus:
          type:
          - string
          - 'null'
          enum:
          - FEASIBLE
          - OPTIMAL
          - INFEASIBLE
          - UNKNOWN
          - MODEL_INVALID
          - null
        unassignedCount:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - runId
      - state
      - snapshotId
      - resultRef
      - solverStatus
      - unassignedCount
    Validation:
      type: object
      additionalProperties: false
      properties:
        versionId: *id001
        valid:
          type: boolean
        contentHash: *id001
        conflicts:
          type: array
          items: *id001
      required:
      - versionId
      - valid
      - contentHash
      - conflicts
    Page:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id001
              label: *id001
            required:
            - id
            - label
        nextCursor:
          type:
          - string
          - 'null'
        asOf: *id001
      required:
      - items
      - nextCursor
      - asOf
    RequestStatus:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - processing
          - finished
        originalHttpStatus:
          type:
          - integer
          - 'null'
        outcome:
          oneOf:
          - $ref: '#/components/schemas/Receipt'
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - state
      - originalHttpStatus
      - outcome
    previewEnrollmentInput:
      type: object
      additionalProperties: false
      properties:
        termId: *id001
        add: &id010
          type: array
          items: *id008
        dropEnrollmentIds: &id011
          type: array
          items: *id001
          uniqueItems: true
      required:
      - termId
      - add
      - dropEnrollmentIds
    enrollInput:
      type: object
      additionalProperties: false
      properties:
        termId: *id001
        bundles: &id009
          type: array
          items: *id008
          minItems: 1
          uniqueItems: true
